# The example in docs/authorization.md, with the providers of
# testdata/authentication.yaml.
mode: enforce
global:
  owners:
  # Platform admins.
  - google:paul@basicblock.io
  # Operators' kubectl-ate (a TokenRequest for ate-system/ate-client).
  - kubernetes:system:serviceaccount:ate-system:ate-client
  # Substrate's own components, by their pod identity certificates.
  - mtls:spiffe://cluster.local/ns/ate-system/sa/ate-controller
  - mtls:spiffe://cluster.local/ns/ate-system/sa/atenet-router
  - mtls:spiffe://cluster.local/ns/ate-system/sa/atenet-egress
  - mtls:spiffe://cluster.local/ns/ate-system/sa/atelet
  atespaceCreators:
  # Any basicblock.io developer, each owning the atespaces they create.
  - group:google/basicblock
  # An agent runtime's Google service account.
  - google:eve-runtime@basicblock-internal.iam.gserviceaccount.com
atespaces:
  # Developers create workspaces from these templates in their own atespaces.
  bb-dev:
    viewers:
    - group:google/basicblock
  # The eve runtime's Kubernetes service account drives actors here only.
  eve-demo:
    editors:
    - kubernetes:system:serviceaccount:internal-eve-demo:eve-demo

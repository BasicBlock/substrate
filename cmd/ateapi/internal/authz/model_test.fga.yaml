name: Substrate Authorization Model Tests
model_file: ./model.fga

tuples:
  # Global Scope
  - user: user:carol
    relation: owner
    object: global:root
  - user: user:frank
    relation: viewer
    object: global:root

  # Atespace Scope (space-1 linked to global:root)
  - user: global:root
    relation: parent_global
    object: atespace:space-1
  - user: user:alice
    relation: owner
    object: atespace:space-1
  - user: user:bob
    relation: editor
    object: atespace:space-1
  - user: user:dave
    relation: viewer
    object: atespace:space-1

  # Templates
  - user: atespace:space-1
    relation: parent_atespace
    object: actor_template:private-template

  # Physical Topology & Scheduling (Node -> Worker -> Actor)
  - user: node:node-1
    relation: host_node
    object: worker:pod-1
  - user: node:node-2
    relation: host_node
    object: worker:pod-2

  # Groups and creators
  - user: group:developers#member
    relation: atespace_creator
    object: global:root
  - user: group:developers#member
    relation: viewer
    object: atespace:templates
  - user: global:root
    relation: parent_global
    object: atespace:templates
  - user: user:grace
    relation: member
    object: group:developers
  - user: user:grace
    relation: creator
    object: atespace:grace-space
  - user: global:root
    relation: parent_global
    object: atespace:grace-space

  # Actor Instance (actor:runner-1 in atespace:space-1 scheduled on worker:pod-1)
  - user: atespace:space-1
    relation: parent_atespace
    object: actor:runner-1
  - user: worker:pod-1
    relation: scheduled_worker
    object: actor:runner-1

  # Machine identities & ingress permissions
  - user: user:sa-router
    relation: can_resume
    object: actor:runner-1
  - user: user:sa-runner-1
    relation: can_suspend
    object: actor:runner-1
  - user: user:sa-runner-1
    relation: can_revert
    object: actor:runner-1

  # Global connector (a preview proxy) and an atespace it was never bound to,
  # created on demand with no other role bindings at all.
  - user: user:conrad
    relation: connector
    object: global:root
  - user: global:root
    relation: parent_global
    object: atespace:preview-alice
  - user: atespace:preview-alice
    relation: parent_atespace
    object: actor:preview-alice/box

  # Pattern bindings: an editor and a viewer of atespace_pattern:dev- (dev-*),
  # an atespace it matches (ate-api supplies parent_pattern by name) and one it
  # does not.
  - user: user:reaper
    relation: editor
    object: atespace_pattern:dev-
  - user: user:rita
    relation: viewer
    object: atespace_pattern:dev-
  - user: global:root
    relation: parent_global
    object: atespace:dev-alice
  - user: atespace_pattern:dev-
    relation: parent_pattern
    object: atespace:dev-alice
  - user: atespace:dev-alice
    relation: parent_atespace
    object: actor:dev-alice/box
  - user: global:root
    relation: parent_global
    object: atespace:eve
  - user: atespace:eve
    relation: parent_atespace
    object: actor:eve/box

tests:
  - name: 1. Global Superadmin & Viewer Propagation
    check:
      # Global Owner (Carol)
      - user: user:carol
        object: global:root
        assertions:
          owner: true
          viewer: true
          can_create_atespace: true
          can_set_policy: true
          can_get_policy: true
          can_get: true
      - user: user:carol
        object: atespace:space-1
        assertions:
          owner: true
          editor: true
          viewer: true
          can_set_policy: true
          can_get_policy: true
          can_create_actor: true
          can_create_actor_template: true
          can_get: true
          can_update: true
          can_delete: true

      # Global Viewer (Frank)
      - user: user:frank
        object: global:root
        assertions:
          owner: false
          viewer: true
          can_create_atespace: false
          can_set_policy: false
          can_get_policy: true
          can_get: true
      - user: user:frank
        object: atespace:space-1
        assertions:
          owner: false
          editor: false
          viewer: true
          can_set_policy: false
          can_get_policy: true
          can_create_actor: false
          can_create_actor_template: false
          can_get: true
          can_update: false
          can_delete: false

  - name: 2. Atespace 3-Tier Roles & Governance Isolation
    check:
      - user: user:alice # Owner
        object: atespace:space-1
        assertions:
          owner: true
          editor: true
          viewer: true
          can_set_policy: true
          can_get_policy: true
          can_create_actor: true
          can_create_actor_template: true
          can_get: true
          can_update: true
          can_delete: true
      - user: user:bob # Editor
        object: atespace:space-1
        assertions:
          owner: false
          editor: true
          viewer: true
          can_set_policy: false
          can_get_policy: true
          can_create_actor: true
          can_create_actor_template: true
          can_get: true
          can_update: true
          can_delete: false
      - user: user:dave # Viewer
        object: atespace:space-1
        assertions:
          owner: false
          editor: false
          viewer: true
          can_set_policy: false
          can_get_policy: true
          can_create_actor: false
          can_create_actor_template: false
          can_get: true
          can_update: false
          can_delete: false
      - user: user:eve # External / Unauthenticated
        object: atespace:space-1
        assertions:
          owner: false
          editor: false
          viewer: false
          can_get: false

  - name: 3. Actor Template Operations (Inherited from Atespace)
    check:
      - user: user:alice # Owner can get, update, delete private template
        object: actor_template:private-template
        assertions:
          can_get: true
          can_update: true
          can_delete: true
      - user: user:bob # Editor can get, update, delete private template
        object: actor_template:private-template
        assertions:
          can_get: true
          can_update: true
          can_delete: true
      - user: user:dave # Viewer can get, but NOT update or delete
        object: actor_template:private-template
        assertions:
          can_get: true
          can_update: false
          can_delete: false
      - user: user:frank # Global viewer can get template via parent global
        object: actor_template:private-template
        assertions:
          can_get: true
          can_update: false
          can_delete: false
      - user: user:eve # External cannot access private template
        object: actor_template:private-template
        assertions:
          can_get: false
          can_update: false
          can_delete: false

  - name: 4. Actor Instance Operations (Inherited from Atespace)
    check:
      - user: user:alice # Owner
        object: actor:runner-1
        assertions:
          can_get: true
          can_update: true
          can_delete: true
          can_resume: true
          can_connect: true
          can_suspend: true
          can_revert: true
      - user: user:bob # Editor
        object: actor:runner-1
        assertions:
          can_get: true
          can_update: true
          can_delete: true
          can_resume: true
          can_connect: true
          can_suspend: true
          can_revert: true
      - user: user:dave # Viewer
        object: actor:runner-1
        assertions:
          can_get: true
          can_update: false
          can_delete: false
          can_resume: false
          can_connect: false
          can_suspend: false
          can_revert: false
      - user: user:frank # Cluster Viewer
        object: actor:runner-1
        assertions:
          can_get: true
          can_update: false
          can_delete: false
          can_resume: false
          can_connect: false
          can_suspend: false
          can_revert: false
      - user: user:sa-router # Ingress router proxy
        object: actor:runner-1
        assertions:
          can_resume: true
          can_connect: false
      - user: user:sa-runner-1 # Workload identity can suspend and revert
        object: actor:runner-1
        assertions:
          can_suspend: true
          can_revert: true

  - name: 5. Node Restriction (can_mint_ateom_actor_credential)
    check:
      - user: node:node-1 # Active host node
        object: actor:runner-1
        assertions:
          can_mint_ateom_actor_credential: true
      - user: node:node-2 # Other node
        object: actor:runner-1
        assertions:
          can_mint_ateom_actor_credential: false

  - name: 6. Groups and Creators
    check:
      - user: user:grace # Group member may create atespaces
        object: global:root
        assertions:
          can_create_atespace: true
          owner: false
      - user: user:eve # Non-member may not
        object: global:root
        assertions:
          can_create_atespace: false
      - user: user:grace # Creator owns the atespace
        object: atespace:grace-space
        assertions:
          owner: true
          can_create_actor: true
          can_delete: true
      - user: user:alice # Another atespace's owner does not
        object: atespace:grace-space
        assertions:
          owner: false
          can_get: false
      - user: user:grace # Group viewer reads but cannot write
        object: atespace:templates
        assertions:
          can_get: true
          can_create_actor: false

  - name: 7. Global Connector (can_connect only, everywhere)
    check:
      - user: user:conrad
        object: global:root
        assertions:
          connector: true
          owner: false
          viewer: false
          atespace_creator: false
          can_create_atespace: false
          can_get: false
          can_set_policy: false
          can_get_policy: false
      # An atespace it was already bound to nothing else in.
      - user: user:conrad
        object: atespace:space-1
        assertions:
          connector: true
          owner: false
          editor: false
          viewer: false
          can_get: false
          can_update: false
          can_delete: false
          can_create_actor: false
          can_create_actor_template: false
      - user: user:conrad
        object: actor:runner-1
        assertions:
          can_connect: true
          can_get: false
          can_update: false
          can_delete: false
          can_resume: false
          can_suspend: false
          can_revert: false
      # An atespace created on demand with no other bindings at all: still reachable.
      - user: user:conrad
        object: atespace:preview-alice
        assertions:
          connector: true
          viewer: false
          can_get: false
      - user: user:conrad
        object: actor:preview-alice/box
        assertions:
          can_connect: true
          can_get: false
          can_update: false
          can_delete: false
          can_resume: false
          can_suspend: false
          can_revert: false
      # An unbound principal still cannot connect anywhere.
      - user: user:eve
        object: actor:preview-alice/box
        assertions:
          can_connect: false

  - name: Pattern bindings reach matching atespaces only
    check:
      # A pattern editor edits actors in a matching atespace.
      - user: user:reaper
        object: actor:dev-alice/box
        assertions:
          can_get: true
          can_delete: true
          can_suspend: true
      # It is an editor of the atespace, not its owner.
      - user: user:reaper
        object: atespace:dev-alice
        assertions:
          viewer: true
          editor: true
          owner: false
          can_delete: false
      # Nothing in an atespace the pattern does not match.
      - user: user:reaper
        object: actor:eve/box
        assertions:
          can_get: false
          can_delete: false
      # Nothing globally.
      - user: user:reaper
        object: global:root
        assertions:
          viewer: false
          can_get: false
      # A pattern viewer reads and changes nothing.
      - user: user:rita
        object: actor:dev-alice/box
        assertions:
          can_get: true
          can_delete: false

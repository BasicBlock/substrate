# Temporary verification branch only; the release branch remains unchanged.
name: Native cold restore proof
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Unused by this isolated configuration proof'
        required: false
permissions:
  contents: read
jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUBSTRATE_DISPOSABLE_PROOF: eng-4039
      ATE_INSTALL_E2E_TUNING: "true"
      ATE_CREDENTIAL_PROVIDER: '{"name":"k8s.io"}'
      ATE_PREVIEW: ''
      ATE_INGRESS_ALLOWED_SPIFFE_IDS: spiffe://cluster.local/ns/ate-e2e-router-client/sa/router-client
      ARTIFACTS: ${{ github.workspace }}/_artifacts
      E2E_JUNIT_FILE: ${{ github.workspace }}/_artifacts/native-coldrestore.xml
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: e2e-go-${{ runner.os }}-${{ github.sha }}
          restore-keys: e2e-go-${{ runner.os }}-
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5001"]
              http = true
      - name: Prove native runtime transition
        run: hack/prove-native-coldrestore.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-coldrestore-proof
          path: ${{ env.ARTIFACTS }}
          if-no-files-found: error
